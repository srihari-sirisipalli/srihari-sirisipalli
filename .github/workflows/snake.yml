name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: srihari-sirisipalli
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#B04A2A&color_dots=#EDE5D3,#F0DACF,#E2A98A,#C46B4A,#B04A2A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B04A2A&color_dots=#161B22,#3A1B10,#7A2E17,#9C3E1F,#B04A2A

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
